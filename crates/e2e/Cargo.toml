[package]
name = "e2e"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

# Its own `main`, because the suite's last step, that no server is left, has to run after every
# test, which the standard harness can't promise.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

# Runs its own process again, which is what several suites on one target directory come to.
[[test]]
name = "shared_target"
path = "tests/shared_target.rs"

[dependencies]
ciborium.workspace = true
format.workspace = true
futures-util.workspace = true
hmac.workspace = true
proto.workspace = true
rcgen.workspace = true
rustls.workspace = true
sdk.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
