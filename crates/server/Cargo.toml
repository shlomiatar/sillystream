[package]
name = "server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[[bin]]
name = "sillystream-server"
path = "src/bin/sillystream-server.rs"
bench = false

[features]
# Crash points for the crash matrix. Never on in a release build.
test-hooks = ["storage/test-hooks"]

[dependencies]
futures-util.workspace = true
format.workspace = true
proto.workspace = true
auth.workspace = true
storage.workspace = true
xxhash-rust.workspace = true
bytes.workspace = true
socket2 = "0.5"
ciborium.workspace = true
object_store.workspace = true
rustls = { workspace = true }
rustls-pemfile = "2"
sha1 = "0.10"
hmac.workspace = true
sha2.workspace = true
webpki-roots = "1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
# Turns the crash points on in the binary that `cargo test` builds for its tests.
server = { path = ".", features = ["test-hooks"] }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["tls12"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
async-trait = "0.1"
futures = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "state_apply"
harness = false

[[bench]]
name = "fan_out"
harness = false

[[bench]]
name = "slab_alloc"
harness = false
